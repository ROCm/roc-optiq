name: Continuous Integration Controller
run-name: roc-optiq-ci

on:
  workflow_dispatch:
    inputs:
      enable_full_os_versions:
        description: 'Run CI for all OS versions?'
        type: boolean
        default: false
      enable_ci_redhat:
        description: 'Run RedHat CI?'
        type: boolean
        default: true
      enable_ci_ubuntu:
        description: 'Run Ubuntu CI?'
        type: boolean
        default: true
      enable_ci_windows:
        description: 'Run Windows CI?'
        type: boolean
        default: true
      enable_ci_mac:
        description: 'Run macOS CI?'
        type: boolean
        default: true
      enable_ci_manylinux:
        description: 'Run ManyLinux CI?'
        type: boolean
        default: true
      enable_ci_asan:
        description: 'Run Ubuntu ASAN?'
        type: boolean
        default: true        
      enable_ci_experimental:
        description: 'Allow Experimental CI?'
        type: boolean
        default: false
      exp_crypto_backend:
        description: 'Experimental: crypto backend for libssh2'
        type: choice
        options:
          - 'OpenSSL'
          - 'mbedTLS'
        default: 'OpenSSL'
      exp_enable_internal_banner:
        description: 'Experimental: show the internal build banner'
        type: boolean
        default: true
      exp_enable_profiler:
        description: 'Experimental: in-app profiler launch'
        type: boolean
        default: true
      exp_enable_remote:
        description: 'Experimental: remote/SSH support'
        type: boolean
        default: true
      exp_enable_agentic_profiling:
        description: 'Experimental: Ask Optiq assistant'
        type: boolean
        default: true
      exp_enable_scripting:
        description: 'Experimental: embedded Python analysis scripts'
        type: boolean
        default: true
      exp_enable_vendor_python:
        description: 'Experimental: bundle a pinned CPython with scripting builds'
        type: boolean
        default: true
      exp_enable_trace_compare:
        description: 'Experimental: trace comparison'
        type: boolean
        default: true
      exp_enable_multi_window:
        description: 'Experimental: multi-window / floating windows'
        type: boolean
        default: true
      upload_to_github:
        description: 'Upload build artifacts to GitHub Artifacts?'
        type: boolean
        default: false
      upload_to_s3:
        description: 'Upload build artifacts to the roc-optiq S3 bucket?'
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'doc/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    env:
      # Full OS Coverage (default for scheduled runs)
      UBUNTU_FULL_OS_VERSIONS: '[ "22.04", "24.04", "26.04" ]'
      REDHAT_FULL_OS_VERSIONS: '[ "8", "9", "10" ]'
      WINDOWS_FULL_OS_VERSIONS: '[ "2022" ]'
      MAC_FULL_OS_VERSIONS: '[ "14", "15", "26" ]'
      # Minimal OS Coverage (default for all other runs)
      UBUNTU_CI_OS_VERSIONS: '[ "24.04" ]'
      REDHAT_CI_OS_VERSIONS: '[ "10" ]'
      WINDOWS_CI_OS_VERSIONS: '[ "2022" ]'
      MAC_CI_OS_VERSIONS: '[ "26" ]'
    outputs:
      ubuntu-os-versions: ${{ steps.setup-os-versions.outputs.ubuntu-os-versions }}
      redhat-os-versions: ${{ steps.setup-os-versions.outputs.redhat-os-versions }}
      windows-os-versions: ${{ steps.setup-os-versions.outputs.windows-os-versions }}
      mac-os-versions: ${{ steps.setup-os-versions.outputs.mac-os-versions }}
      # Experimental feature flags. Scheduled runs get no inputs and build
      # everything. Outputs are strings: read the booleans through fromJSON.
      exp-crypto-backend: ${{ github.event_name == 'schedule' && 'OpenSSL' || inputs.exp_crypto_backend }}
      exp-enable-internal-banner: ${{ github.event_name == 'schedule' || inputs.exp_enable_internal_banner }}
      exp-enable-profiler: ${{ github.event_name == 'schedule' || inputs.exp_enable_profiler }}
      exp-enable-remote: ${{ github.event_name == 'schedule' || inputs.exp_enable_remote }}
      exp-enable-agentic-profiling: ${{ github.event_name == 'schedule' || inputs.exp_enable_agentic_profiling }}
      exp-enable-scripting: ${{ github.event_name == 'schedule' || inputs.exp_enable_scripting }}
      exp-enable-vendor-python: ${{ github.event_name == 'schedule' || inputs.exp_enable_vendor_python }}
      exp-enable-trace-compare: ${{ github.event_name == 'schedule' || inputs.exp_enable_trace_compare }}
      exp-enable-multi-window: ${{ github.event_name == 'schedule' || inputs.exp_enable_multi_window }}
    steps:
      - name: Set OS versions
        id: setup-os-versions
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event.inputs.enable_full_os_versions }}" == "true" ]]; then
            echo "ubuntu-os-versions=${{ env.UBUNTU_FULL_OS_VERSIONS }}" >> "$GITHUB_OUTPUT"
            echo "redhat-os-versions=${{ env.REDHAT_FULL_OS_VERSIONS }}" >> "$GITHUB_OUTPUT"
            echo "windows-os-versions=${{ env.WINDOWS_FULL_OS_VERSIONS }}" >> "$GITHUB_OUTPUT"
            echo "mac-os-versions=${{ env.MAC_FULL_OS_VERSIONS }}" >> "$GITHUB_OUTPUT"
          else
            echo "ubuntu-os-versions=${{ env.UBUNTU_CI_OS_VERSIONS }}" >> "$GITHUB_OUTPUT"
            echo "redhat-os-versions=${{ env.REDHAT_CI_OS_VERSIONS }}" >> "$GITHUB_OUTPUT"
            echo "windows-os-versions=${{ env.WINDOWS_CI_OS_VERSIONS }}" >> "$GITHUB_OUTPUT"
            echo "mac-os-versions=${{ env.MAC_CI_OS_VERSIONS }}" >> "$GITHUB_OUTPUT"
          fi

  ci-redhat:
    name: RedHat CI
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_ci_redhat }}
    uses: ./.github/workflows/ci-redhat.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.redhat-os-versions }}
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_root_directory: ${{ github.event_name == 'schedule' && 'nightly' || 'test' }}

  ci-redhat-experimental:
    name: RedHat CI - Experimental
    needs: setup
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.enable_ci_redhat && inputs.enable_ci_experimental) }}
    uses: ./.github/workflows/ci-redhat.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.redhat-os-versions }}
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_root_directory: ${{ github.event_name == 'schedule' && 'nightly-experimental' || 'test' }}
      artifact_suffix: '-experimental'
      # EXPERIMENTAL FLAGS
      crypto_backend: ${{ needs.setup.outputs.exp-crypto-backend }}
      enable_internal_banner: ${{ fromJSON(needs.setup.outputs.exp-enable-internal-banner) }}
      enable_profiler: ${{ fromJSON(needs.setup.outputs.exp-enable-profiler) }}
      enable_remote: ${{ fromJSON(needs.setup.outputs.exp-enable-remote) }}
      enable_agentic_profiling: ${{ fromJSON(needs.setup.outputs.exp-enable-agentic-profiling) }}
      enable_scripting: ${{ fromJSON(needs.setup.outputs.exp-enable-scripting) }}
      enable_vendor_python: ${{ fromJSON(needs.setup.outputs.exp-enable-vendor-python) }}
      enable_trace_compare: ${{ fromJSON(needs.setup.outputs.exp-enable-trace-compare) }}
      enable_multi_window: ${{ fromJSON(needs.setup.outputs.exp-enable-multi-window) }}

  ci-ubuntu:
    name: Ubuntu CI
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_ci_ubuntu }}
    uses: ./.github/workflows/ci-ubuntu.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.ubuntu-os-versions }}
      enable_ui_tests: true
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_root_directory: ${{ github.event_name == 'schedule' && 'nightly' || 'test' }}

  ci-ubuntu-experimental:
    name: Ubuntu CI - Experimental
    needs: setup
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.enable_ci_ubuntu && inputs.enable_ci_experimental) }}
    uses: ./.github/workflows/ci-ubuntu.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.ubuntu-os-versions }}
      enable_ui_tests: true
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_root_directory: ${{ github.event_name == 'schedule' && 'nightly-experimental' || 'test' }}
      artifact_suffix: '-experimental'
      # EXPERIMENTAL FLAGS
      crypto_backend: ${{ needs.setup.outputs.exp-crypto-backend }}
      enable_internal_banner: ${{ fromJSON(needs.setup.outputs.exp-enable-internal-banner) }}
      enable_profiler: ${{ fromJSON(needs.setup.outputs.exp-enable-profiler) }}
      enable_remote: ${{ fromJSON(needs.setup.outputs.exp-enable-remote) }}
      enable_agentic_profiling: ${{ fromJSON(needs.setup.outputs.exp-enable-agentic-profiling) }}
      enable_scripting: ${{ fromJSON(needs.setup.outputs.exp-enable-scripting) }}
      enable_vendor_python: ${{ fromJSON(needs.setup.outputs.exp-enable-vendor-python) }}
      enable_trace_compare: ${{ fromJSON(needs.setup.outputs.exp-enable-trace-compare) }}
      enable_multi_window: ${{ fromJSON(needs.setup.outputs.exp-enable-multi-window) }}

  ci-windows:
    name: Windows CI
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_ci_windows }}
    uses: ./.github/workflows/ci-windows.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.windows-os-versions }}
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_root_directory: ${{ github.event_name == 'schedule' && 'nightly' || 'test' }}

  ci-windows-experimental:
    name: Windows CI - Experimental
    needs: setup
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.enable_ci_windows && inputs.enable_ci_experimental) }}
    uses: ./.github/workflows/ci-windows.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.windows-os-versions }}
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_root_directory: ${{ github.event_name == 'schedule' && 'nightly-experimental' || 'test' }}
      artifact_suffix: '-experimental'
      # EXPERIMENTAL FLAGS
      crypto_backend: ${{ needs.setup.outputs.exp-crypto-backend }}
      enable_internal_banner: ${{ fromJSON(needs.setup.outputs.exp-enable-internal-banner) }}
      enable_profiler: ${{ fromJSON(needs.setup.outputs.exp-enable-profiler) }}
      enable_remote: ${{ fromJSON(needs.setup.outputs.exp-enable-remote) }}
      enable_agentic_profiling: ${{ fromJSON(needs.setup.outputs.exp-enable-agentic-profiling) }}
      enable_scripting: ${{ fromJSON(needs.setup.outputs.exp-enable-scripting) }}
      enable_vendor_python: ${{ fromJSON(needs.setup.outputs.exp-enable-vendor-python) }}
      enable_trace_compare: ${{ fromJSON(needs.setup.outputs.exp-enable-trace-compare) }}
      enable_multi_window: ${{ fromJSON(needs.setup.outputs.exp-enable-multi-window) }}

  ci-mac:
    name: macOS CI
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_ci_mac }}
    uses: ./.github/workflows/ci-mac.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.mac-os-versions }}
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_root_directory: ${{ github.event_name == 'schedule' && 'nightly' || 'test' }}

  ci-mac-experimental:
    name: macOS CI - Experimental
    needs: setup
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.enable_ci_mac && inputs.enable_ci_experimental) }}
    uses: ./.github/workflows/ci-mac.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.mac-os-versions }}
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_root_directory: ${{ github.event_name == 'schedule' && 'nightly-experimental' || 'test' }}
      artifact_suffix: '-experimental'
      # EXPERIMENTAL FLAGS
      crypto_backend: ${{ needs.setup.outputs.exp-crypto-backend }}
      enable_internal_banner: ${{ fromJSON(needs.setup.outputs.exp-enable-internal-banner) }}
      enable_profiler: ${{ fromJSON(needs.setup.outputs.exp-enable-profiler) }}
      enable_remote: ${{ fromJSON(needs.setup.outputs.exp-enable-remote) }}
      enable_agentic_profiling: ${{ fromJSON(needs.setup.outputs.exp-enable-agentic-profiling) }}
      enable_scripting: ${{ fromJSON(needs.setup.outputs.exp-enable-scripting) }}
      enable_vendor_python: ${{ fromJSON(needs.setup.outputs.exp-enable-vendor-python) }}
      enable_trace_compare: ${{ fromJSON(needs.setup.outputs.exp-enable-trace-compare) }}
      enable_multi_window: ${{ fromJSON(needs.setup.outputs.exp-enable-multi-window) }}

  ci-asan:
    name: Ubuntu ASAN
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_ci_asan }}
    uses: ./.github/workflows/ci-asan.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.ubuntu-os-versions }}
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}

  ci-manylinux:
    name: ManyLinux CI
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_ci_manylinux }}
    uses: ./.github/workflows/ci-manylinux.yml
    secrets: inherit
    with:
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_bucket_env: ${{ github.event_name == 'schedule' && 'nightly' || 'legacy-nightly' }}

  ci-manylinux-experimental:
    name: ManyLinux CI - Experimental
    needs: setup
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.enable_ci_manylinux && inputs.enable_ci_experimental) }}
    uses: ./.github/workflows/ci-manylinux.yml
    secrets: inherit
    with:
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_bucket_env: 'legacy-nightly'
      s3_root_directory: 'nightly-experimental'
      artifact_suffix: '-experimental'
      # EXPERIMENTAL FLAGS
      crypto_backend: ${{ needs.setup.outputs.exp-crypto-backend }}
      enable_internal_banner: ${{ fromJSON(needs.setup.outputs.exp-enable-internal-banner) }}
      enable_profiler: ${{ fromJSON(needs.setup.outputs.exp-enable-profiler) }}
      enable_remote: ${{ fromJSON(needs.setup.outputs.exp-enable-remote) }}
      enable_agentic_profiling: ${{ fromJSON(needs.setup.outputs.exp-enable-agentic-profiling) }}
      enable_scripting: ${{ fromJSON(needs.setup.outputs.exp-enable-scripting) }}
      enable_vendor_python: ${{ fromJSON(needs.setup.outputs.exp-enable-vendor-python) }}
      enable_trace_compare: ${{ fromJSON(needs.setup.outputs.exp-enable-trace-compare) }}
      enable_multi_window: ${{ fromJSON(needs.setup.outputs.exp-enable-multi-window) }}
