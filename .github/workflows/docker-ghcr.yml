name: Build and Publish GHCR Docker Images for Optiq CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/docker-ghcr.yml'
      - 'docker/**'

env:
  VULKAN_SDK_VERSION: 1.4.328.1
  
jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        os-release: [ 'ubuntu-22.04', 'ubuntu-24.04', 'ubuntu-26.04', 'rhel-8', 'rhel-9', 'rhel-10', 'manylinux' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: docker

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker args
        id: setup_args
        run: |
          OS_RELEASE=${{ matrix.os-release }}
          if [[ "$OS_RELEASE" == "manylinux" ]]; then
            echo "distro=manylinux" >> $GITHUB_OUTPUT
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "docker_file=docker/Dockerfile.manylinux" >> $GITHUB_OUTPUT
          else
            DISTRO=$(echo $OS_RELEASE | cut -d'-' -f1)
            VERSION=$(echo $OS_RELEASE | cut -d'-' -f2)
            echo "distro=$DISTRO" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "docker_file=docker/Dockerfile.$DISTRO" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/ROCm/optiq-ci-${{ steps.setup_args.outputs.distro }}

      - name: Build Optiq CI Container (Does not Push on PR)
        timeout-minutes: 15
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ steps.setup_args.outputs.docker_file }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ steps.setup_args.outputs.version }}
            VULKAN_SDK_VERSION=${{ env.VULKAN_SDK_VERSION }}
          tags: |
            ghcr.io/rocm/optiq-ci-${{ steps.setup_args.outputs.distro }}:${{ steps.setup_args.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
