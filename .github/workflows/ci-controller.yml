name: Continuous Integration Controller
run-name: roc-optiq-ci

on:
  workflow_dispatch:
    inputs:
      enable_full_os_versions:
        description: 'Run CI for all OS versions?'
        type: boolean
        default: false
      enable_ci_redhat:
        description: 'Run RedHat CI?'
        type: boolean
        default: true
      enable_ci_ubuntu:
        description: 'Run Ubuntu CI?'
        type: boolean
        default: true
      enable_ci_windows:
        description: 'Run Windows CI?'
        type: boolean
        default: true
      enable_ci_mac:
        description: 'Run macOS CI?'
        type: boolean
        default: true
      enable_ci_manylinux:
        description: 'Run ManyLinux CI?'
        type: boolean
        default: true
      enable_ci_asan:
        description: 'Run Ubuntu ASAN?'
        type: boolean
        default: true        
      enable_ci_experimental:
        description: 'Run Experimental CI with every experimental feature enabled?'
        type: boolean
        default: false
      experimental_config:
        description: 'Custom experimental build as a JSON object of CMake variables, e.g. {"ROCPROFVIS_ENABLE_REMOTE":"ON","CRYPTO_BACKEND":"mbedTLS"}. Runs Experimental CI. Applied on top of the toggle above when both are set.'
        type: string
        default: ''
      upload_to_github:
        description: 'Upload build artifacts to GitHub Artifacts?'
        type: boolean
        default: false
      upload_to_s3:
        description: 'Upload build artifacts to the roc-optiq S3 bucket?'
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'doc/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    env:
      # Full OS Coverage (default for scheduled runs)
      UBUNTU_FULL_OS_VERSIONS: '[ "22.04", "24.04", "26.04" ]'
      REDHAT_FULL_OS_VERSIONS: '[ "8", "9", "10" ]'
      WINDOWS_FULL_OS_VERSIONS: '[ "2022" ]'
      MAC_FULL_OS_VERSIONS: '[ "15", "26" ]'
      # Minimal OS Coverage (default for all other runs)
      UBUNTU_CI_OS_VERSIONS: '[ "24.04" ]'
      REDHAT_CI_OS_VERSIONS: '[ "10" ]'
      WINDOWS_CI_OS_VERSIONS: '[ "2022" ]'
      MAC_CI_OS_VERSIONS: '[ "26" ]'
    outputs:
      ubuntu-os-versions: ${{ steps.setup-os-versions.outputs.ubuntu-os-versions }}
      redhat-os-versions: ${{ steps.setup-os-versions.outputs.redhat-os-versions }}
      windows-os-versions: ${{ steps.setup-os-versions.outputs.windows-os-versions }}
      mac-os-versions: ${{ steps.setup-os-versions.outputs.mac-os-versions }}
      run-experimental: ${{ steps.setup-experimental.outputs.run-experimental }}
      exp-cmake-args: ${{ steps.setup-experimental.outputs.exp-cmake-args }}
      exp-crypto-backend: ${{ steps.setup-experimental.outputs.exp-crypto-backend }}
    steps:
      - name: Set OS versions
        id: setup-os-versions
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event.inputs.enable_full_os_versions }}" == "true" ]]; then
            echo "ubuntu-os-versions=${{ env.UBUNTU_FULL_OS_VERSIONS }}" >> "$GITHUB_OUTPUT"
            echo "redhat-os-versions=${{ env.REDHAT_FULL_OS_VERSIONS }}" >> "$GITHUB_OUTPUT"
            echo "windows-os-versions=${{ env.WINDOWS_FULL_OS_VERSIONS }}" >> "$GITHUB_OUTPUT"
            echo "mac-os-versions=${{ env.MAC_FULL_OS_VERSIONS }}" >> "$GITHUB_OUTPUT"
          else
            echo "ubuntu-os-versions=${{ env.UBUNTU_CI_OS_VERSIONS }}" >> "$GITHUB_OUTPUT"
            echo "redhat-os-versions=${{ env.REDHAT_CI_OS_VERSIONS }}" >> "$GITHUB_OUTPUT"
            echo "windows-os-versions=${{ env.WINDOWS_CI_OS_VERSIONS }}" >> "$GITHUB_OUTPUT"
            echo "mac-os-versions=${{ env.MAC_CI_OS_VERSIONS }}" >> "$GITHUB_OUTPUT"
          fi

      # Scheduled runs and the enable_ci_experimental toggle turn on every
      # experimental feature through the ROCPROFVIS_ENABLE_EXPERIMENTAL CMake
      # umbrella, so this file never lists individual features. experimental_config
      # adds or overrides single variables on top of that.
      - name: Set experimental build options
        id: setup-experimental
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXP_TOGGLE: ${{ inputs.enable_ci_experimental }}
          EXP_CONFIG: ${{ inputs.experimental_config }}
        run: |
          set -euo pipefail
          run_experimental=false
          cmake_args=""
          crypto_backend="OpenSSL"

          if [[ "$EVENT_NAME" == "schedule" || "$EXP_TOGGLE" == "true" ]]; then
            run_experimental=true
            cmake_args="-DROCPROFVIS_ENABLE_EXPERIMENTAL=ON"
          fi

          if [[ -n "${EXP_CONFIG//[[:space:]]/}" ]]; then
            run_experimental=true
            if ! jq -e 'type == "object" and ([.[] | type] | all(. == "string" or . == "boolean"))' <<< "$EXP_CONFIG" > /dev/null; then
              echo "::error::experimental_config must be a JSON object whose values are strings or booleans"
              exit 1
            fi
            while IFS=$'\t' read -r key value; do
              if [[ ! "$key" =~ ^(ROCPROFVIS_[A-Z0-9_]+|CRYPTO_BACKEND)$ ]]; then
                echo "::error::experimental_config key '$key' must be CRYPTO_BACKEND or start with ROCPROFVIS_"
                exit 1
              fi
              if [[ ! "$value" =~ ^[A-Za-z0-9._-]+$ ]]; then
                echo "::error::experimental_config value '$value' for '$key' has unsupported characters"
                exit 1
              fi
              if [[ "$key" == "CRYPTO_BACKEND" ]]; then
                crypto_backend="$value"
              else
                cmake_args="$cmake_args -D$key=$value"
              fi
            done < <(jq -r 'to_entries[] | [.key, (.value | if type == "boolean" then (if . then "ON" else "OFF" end) else . end)] | @tsv' <<< "$EXP_CONFIG")
          fi

          {
            echo "run-experimental=$run_experimental"
            echo "exp-cmake-args=${cmake_args# }"
            echo "exp-crypto-backend=$crypto_backend"
          } >> "$GITHUB_OUTPUT"
          echo "Experimental CI: $run_experimental | crypto: $crypto_backend | cmake args: ${cmake_args# }"

  ci-redhat:
    name: RedHat CI
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_ci_redhat }}
    uses: ./.github/workflows/ci-redhat.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.redhat-os-versions }}
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_root_directory: ${{ github.event_name == 'schedule' && 'nightly' || 'test' }}

  ci-redhat-experimental:
    name: RedHat CI - Experimental
    needs: setup
    if: ${{ needs.setup.outputs.run-experimental == 'true' && (github.event_name != 'workflow_dispatch' || inputs.enable_ci_redhat) }}
    uses: ./.github/workflows/ci-redhat.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.redhat-os-versions }}
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_root_directory: ${{ github.event_name == 'schedule' && 'nightly-experimental' || 'test' }}
      artifact_suffix: '-experimental'
      # EXPERIMENTAL FLAGS
      enable_internal_banner: true
      crypto_backend: ${{ needs.setup.outputs.exp-crypto-backend }}
      cmake_args: ${{ needs.setup.outputs.exp-cmake-args }}

  ci-ubuntu:
    name: Ubuntu CI
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_ci_ubuntu }}
    uses: ./.github/workflows/ci-ubuntu.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.ubuntu-os-versions }}
      enable_ui_tests: true
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_root_directory: ${{ github.event_name == 'schedule' && 'nightly' || 'test' }}

  ci-ubuntu-experimental:
    name: Ubuntu CI - Experimental
    needs: setup
    if: ${{ needs.setup.outputs.run-experimental == 'true' && (github.event_name != 'workflow_dispatch' || inputs.enable_ci_ubuntu) }}
    uses: ./.github/workflows/ci-ubuntu.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.ubuntu-os-versions }}
      enable_ui_tests: true
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_root_directory: ${{ github.event_name == 'schedule' && 'nightly-experimental' || 'test' }}
      artifact_suffix: '-experimental'
      # EXPERIMENTAL FLAGS
      enable_internal_banner: true
      crypto_backend: ${{ needs.setup.outputs.exp-crypto-backend }}
      cmake_args: ${{ needs.setup.outputs.exp-cmake-args }}

  ci-windows:
    name: Windows CI
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_ci_windows }}
    uses: ./.github/workflows/ci-windows.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.windows-os-versions }}
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_root_directory: 'nightly'

  ci-windows-experimental:
    name: Windows CI - Experimental
    needs: setup
    if: ${{ needs.setup.outputs.run-experimental == 'true' && (github.event_name != 'workflow_dispatch' || inputs.enable_ci_windows) }}
    uses: ./.github/workflows/ci-windows.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.windows-os-versions }}
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_root_directory: 'nightly-experimental'
      artifact_suffix: '-experimental'
      # EXPERIMENTAL FLAGS
      enable_internal_banner: true
      crypto_backend: ${{ needs.setup.outputs.exp-crypto-backend }}
      cmake_args: ${{ needs.setup.outputs.exp-cmake-args }}

  ci-mac:
    name: macOS CI
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_ci_mac }}
    uses: ./.github/workflows/ci-mac.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.mac-os-versions }}
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_root_directory: ${{ github.event_name == 'schedule' && 'nightly' || 'test' }}

  ci-mac-experimental:
    name: macOS CI - Experimental
    needs: setup
    if: ${{ needs.setup.outputs.run-experimental == 'true' && (github.event_name != 'workflow_dispatch' || inputs.enable_ci_mac) }}
    uses: ./.github/workflows/ci-mac.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.mac-os-versions }}
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_root_directory: ${{ github.event_name == 'schedule' && 'nightly-experimental' || 'test' }}
      artifact_suffix: '-experimental'
      # EXPERIMENTAL FLAGS
      enable_internal_banner: true
      crypto_backend: ${{ needs.setup.outputs.exp-crypto-backend }}
      cmake_args: ${{ needs.setup.outputs.exp-cmake-args }}

  ci-asan:
    name: Ubuntu ASAN
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_ci_asan }}
    uses: ./.github/workflows/ci-asan.yml
    secrets: inherit
    with:
      os_version: ${{ needs.setup.outputs.ubuntu-os-versions }}
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}

  ci-manylinux:
    name: ManyLinux CI
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_ci_manylinux }}
    uses: ./.github/workflows/ci-manylinux.yml
    secrets: inherit
    with:
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_bucket_env: ${{ github.event_name == 'schedule' && 'nightly' || 'legacy-nightly' }}

  ci-manylinux-experimental:
    name: ManyLinux CI - Experimental
    needs: setup
    if: ${{ needs.setup.outputs.run-experimental == 'true' && (github.event_name != 'workflow_dispatch' || inputs.enable_ci_manylinux) }}
    uses: ./.github/workflows/ci-manylinux.yml
    secrets: inherit
    with:
      upload_to_github: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_github == 'true' }}
      upload_to_s3: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_s3 == 'true' }}
      s3_bucket_env: 'legacy-nightly'
      s3_root_directory: 'nightly-experimental'
      artifact_suffix: '-experimental'
      # EXPERIMENTAL FLAGS
      enable_internal_banner: true
      crypto_backend: ${{ needs.setup.outputs.exp-crypto-backend }}
      cmake_args: ${{ needs.setup.outputs.exp-cmake-args }}
