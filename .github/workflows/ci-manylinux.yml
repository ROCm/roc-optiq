name: ManyLinux Continuous Integration
run-name: roc-optiq-manylinux-ci

on:
  workflow_dispatch:
    inputs:
      cmake_config_preset:
        description: 'CMake Config Preset to Use'
        type: string
        default: 'linux-release'
      cmake_build_preset:
        description: 'CMake Build Preset to Use'
        type: string
        default: 'Linux Release Build'
      enable_internal_banner:
        description: 'Enable the internal banner?'
        type: boolean
        default: false
      upload_to_github:
        description: 'Upload build artifacts to GitHub Artifacts?'
        type: boolean
        default: false
      upload_to_s3:
        description: 'Upload built artifacts to the roc-optiq S3 bucket?'
        type: boolean
        default: false
      crypto_backend:
        description: 'Crypto backend for libssh2 (mbedTLS or OpenSSL)'
        type: string
        default: 'mbedTLS'
      enable_remote:
        description: 'Build with remote/SSH support (ROCPROFVIS_ENABLE_REMOTE)'
        type: boolean
        default: false
      enable_profiler:
        description: 'Build with in-app profiler launch (ROCPROFVIS_ENABLE_PROFILER)'
        type: boolean
        default: false
      enable_agentic_profiling:
        description: 'Build with the Ask Optiq assistant (ROCPROFVIS_ENABLE_AGENTIC_PROFILING)'
        type: boolean
        default: false
      enable_scripting:
        description: 'Build with embedded Python analysis scripts (ROCPROFVIS_ENABLE_SCRIPTING)'
        type: boolean
        default: false
      enable_trace_compare:
        description: 'Build with trace comparison support (ROCPROFVIS_ENABLE_TRACE_COMPARE)'
        type: boolean
        default: false
      enable_multi_window:
        description: 'Build with multi-window / floating window support (ROCPROFVIS_MULTI_WINDOW)'
        type: boolean
        default: false
      rocm_version:
        description: 'ROCm version number used in package naming (e.g. 10)'
        type: string
        default: '10'
      s3_bucket_env:
        description: 'S3 bucket environment to upload artifacts to'
        type: choice
        default: 'legacy-nightly'
        options:
          - dev
          - nightly
          - rc
          - stable-staging
          - legacy-nightly
      s3_root_directory:
        description: 'Override S3 root directory (used with legacy-nightly bucket env)'
        type: string
        default: ''
      artifact_suffix:
        description: 'Suffix to append to uploaded artifact names'
        type: string
        default: ''
  workflow_call:
    inputs:
      cmake_config_preset:
        description: 'CMake Config Preset to Use'
        type: string
        default: 'linux-release'
      cmake_build_preset:
        description: 'CMake Build Preset to Use'
        type: string
        default: 'Linux Release Build'
      enable_internal_banner:
        description: 'Enable the internal banner?'
        type: boolean
        default: false
      upload_to_github:
        description: 'Upload build artifacts to GitHub Artifacts?'
        type: boolean
        default: false
      upload_to_s3:
        description: 'Upload built artifacts to the roc-optiq S3 bucket?'
        type: boolean
        default: false
      crypto_backend:
        description: 'Crypto backend for libssh2 (mbedTLS or OpenSSL)'
        type: string
        default: 'mbedTLS'
      enable_remote:
        description: 'Build with remote/SSH support (ROCPROFVIS_ENABLE_REMOTE)'
        type: boolean
        default: false
      enable_profiler:
        description: 'Build with in-app profiler launch (ROCPROFVIS_ENABLE_PROFILER)'
        type: boolean
        default: false
      enable_agentic_profiling:
        description: 'Build with the Ask Optiq assistant (ROCPROFVIS_ENABLE_AGENTIC_PROFILING)'
        type: boolean
        default: false
      enable_scripting:
        description: 'Build with embedded Python analysis scripts (ROCPROFVIS_ENABLE_SCRIPTING)'
        type: boolean
        default: false
      enable_trace_compare:
        description: 'Build with trace comparison support (ROCPROFVIS_ENABLE_TRACE_COMPARE)'
        type: boolean
        default: false
      enable_multi_window:
        description: 'Build with multi-window / floating window support (ROCPROFVIS_MULTI_WINDOW)'
        type: boolean
        default: false
      rocm_version:
        description: 'ROCm version number used in package naming (e.g. 10)'
        type: string
        default: '10'
      s3_bucket_env:
        description: 'S3 bucket environment to upload artifacts to'
        type: string
        default: 'legacy-nightly'
      s3_root_directory:
        description: 'Override S3 root directory (used with legacy-nightly bucket env)'
        type: string
        default: ''
      artifact_suffix:
        description: 'Suffix to append to uploaded artifact names'
        type: string
        default: ''

env:
  BUILD_DIR: "build"
  DIST_DIR: "dist"
  BUILD_FILE_NAME: "roc-optiq"
  ENABLE_INTERNAL_BANNER: ${{ (inputs.enable_internal_banner == true || inputs.enable_internal_banner == 'true') && 'ON' || 'OFF' }}
  ENABLE_REMOTE: ${{ (inputs.enable_remote == true || inputs.enable_remote == 'true') && 'ON' || 'OFF' }}
  ENABLE_PROFILER: ${{ (inputs.enable_profiler == true || inputs.enable_profiler == 'true') && 'ON' || 'OFF' }}
  ENABLE_AGENTIC_PROFILING: ${{ (inputs.enable_agentic_profiling == true || inputs.enable_agentic_profiling == 'true') && 'ON' || 'OFF' }}
  ENABLE_SCRIPTING: ${{ (inputs.enable_scripting == true || inputs.enable_scripting == 'true') && 'ON' || 'OFF' }}
  ENABLE_TRACE_COMPARE: ${{ (inputs.enable_trace_compare == true || inputs.enable_trace_compare == 'true') && 'ON' || 'OFF' }}
  ENABLE_MULTI_WINDOW: ${{ (inputs.enable_multi_window == true || inputs.enable_multi_window == 'true') && 'ON' || 'OFF' }}
  ROCM_VERSION: ${{ inputs.rocm_version }}
  S3_ROOT_DIRECTORY: 'v5/rocm/extras/rocoptiq'

jobs:
  manylinux:
    name: ManyLinux • Optiq CI • GitHub Artifacts (${{ inputs.upload_to_github }}) • S3 Artifacts (${{ inputs.upload_to_s3 }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.s3_bucket_env }}
    defaults:
      run:
        shell: bash
    permissions:
      id-token: write
      contents: read
    container:
      image: ghcr.io/rocm/optiq-ci-manylinux:latest

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          submodules: true

      - name: Install OpenSSL 3
        if: inputs.crypto_backend == 'OpenSSL'
        run: |
          # The image OpenSSL is 1.1.1. Leave it for the OS and install 3.5
          # under /opt/openssl-3. cpp-httplib requires >= 3.0.
          bash .github/scripts/install-openssl3.sh
          # FindOpenSSL reads OPENSSL_ROOT_DIR and the pkg-config path, so both
          # point at the 3.x prefix. Without them it selects the image's 1.1.1.
          echo "OPENSSL_ROOT_DIR=/opt/openssl-3" >> "${GITHUB_ENV}"
          echo "PKG_CONFIG_PATH=/opt/openssl-3/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=/opt/openssl-3/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"

      - name: Select Embeddable Python
        if: inputs.enable_scripting == true || inputs.enable_scripting == 'true'
        run: |
          # /opt/python/cp3xx on PATH is the static manylinux CPython. It has an
          # interpreter and no libpython, so FindPython3 Development.Embed fails.
          # TheRock also installs shared interpreters under /opt/python-shared
          # for embedding. Prefer 3.12 to match the interpreter already on PATH.
          SHARED_PY=""
          for candidate in \
              /opt/python-shared/cp312-cp312 \
              /opt/python-shared/cp313-cp313 \
              /opt/python-shared/cp311-cp311 \
              /opt/python-shared/cp310-cp310
          do
            if [ -x "${candidate}/bin/python3" ]; then
              SHARED_PY="${candidate}"
              break
            fi
          done
          if [ -z "${SHARED_PY}" ]; then
            echo "Scripting needs an embeddable CPython with libpython."
            echo "Looked under /opt/python-shared; the static /opt/python tree cannot be linked."
            ls -la /opt/python /opt/python-shared 2>/dev/null || true
            exit 1
          fi
          echo "Using embeddable Python at ${SHARED_PY}"
          "${SHARED_PY}/bin/python3" --version
          echo "Python3_ROOT_DIR=${SHARED_PY}" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${SHARED_PY}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"

      - name: Build, Make, and Verify Installation
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            --preset ${{ inputs.cmake_config_preset }} \
            -DROCPROFVIS_ENABLE_INTERNAL_BANNER=${{ env.ENABLE_INTERNAL_BANNER }} \
            -DROCPROFVIS_ENABLE_REMOTE=${{ env.ENABLE_REMOTE }} \
            -DROCPROFVIS_ENABLE_PROFILER=${{ env.ENABLE_PROFILER }} \
            -DROCPROFVIS_ENABLE_AGENTIC_PROFILING=${{ env.ENABLE_AGENTIC_PROFILING }} \
            -DROCPROFVIS_ENABLE_SCRIPTING=${{ env.ENABLE_SCRIPTING }} \
            -DROCPROFVIS_ENABLE_TRACE_COMPARE=${{ env.ENABLE_TRACE_COMPARE }} \
            -DROCPROFVIS_MULTI_WINDOW=${{ env.ENABLE_MULTI_WINDOW }} \
            -DGLFW_LINK_STATIC=ON \
            -DCRYPTO_BACKEND=${{ inputs.crypto_backend }} \
            ${OPENSSL_ROOT_DIR:+-DOPENSSL_ROOT_DIR="${OPENSSL_ROOT_DIR}"} \
            ${Python3_ROOT_DIR:+-DPython3_ROOT_DIR="${Python3_ROOT_DIR}"} \
            -DCPACK_GENERATOR="TGZ;DEB;RPM" \
            -DCMAKE_EXE_LINKER_FLAGS="-ldl"
          cmake --build ${{ env.BUILD_DIR }} --parallel 4 --target package
          if [ -e ${{ env.BUILD_DIR }}/${{ env.BUILD_FILE_NAME }} ]; then
            echo "✅ ${{ env.BUILD_FILE_NAME }} has been successfully built!"
          else
            echo "❌ ${{ env.BUILD_FILE_NAME }} was not built!"
            exit 1
          fi

      - name: Run Tests
        id: run_tests
        continue-on-error: true
        timeout-minutes: 10
        run: |
          cd ${{ env.BUILD_DIR }}
          ctest \
            --output-on-failure \
            --no-tests=error \
            --output-junit ctest-results.xml

      - name: Upload Test Logs (on failure)
        if: steps.run_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-manylinux${{ inputs.artifact_suffix }}
          path: |
            ${{ env.BUILD_DIR }}/ctest-results.xml
            ${{ env.BUILD_DIR }}/Testing/Temporary/**
          retention-days: 7

      - name: Prepare Distribution Artifacts
        run: |
          mkdir ${{ env.DIST_DIR }}
          cp ${{ env.BUILD_DIR }}/*.tar.gz ${{ env.DIST_DIR }}/
          cp ${{ env.BUILD_DIR }}/*.deb ${{ env.DIST_DIR }}/
          cp ${{ env.BUILD_DIR }}/*.rpm ${{ env.DIST_DIR }}/
          ls -l ${{ env.DIST_DIR }}/

      - name: Upload GitHub Artifacts
        if: inputs.upload_to_github == true || inputs.upload_to_github == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: roc-optiq-manylinux-release${{ inputs.artifact_suffix }}
          path: |
            ${{ env.DIST_DIR }}/
          retention-days: 2

      - name: Resolve S3 secrets
        if: inputs.upload_to_s3 == true || inputs.upload_to_s3 == 'true'
        run: |
          case "${{ inputs.s3_bucket_env }}" in
            dev)
              echo "S3_BUCKET=${{ secrets.AWS_DEV_EXTRAS_S3_BUCKET }}" >> "$GITHUB_ENV"
              echo "S3_ROLE_ARN=${{ secrets.AWS_DEV_EXTRAS_ROLE_ARN }}" >> "$GITHUB_ENV"
              ;;
            nightly)
              echo "S3_BUCKET=${{ secrets.AWS_NIGHTLY_EXTRAS_S3_BUCKET }}" >> "$GITHUB_ENV"
              echo "S3_ROLE_ARN=${{ secrets.AWS_NIGHTLY_EXTRAS_ROLE_ARN }}" >> "$GITHUB_ENV"
              echo "BUILD_TIMESTAMP=$(date -u '+%Y%m%d')" >> "$GITHUB_ENV"
              ;;
            rc)
              echo "S3_BUCKET=${{ secrets.AWS_RC_EXTRAS_S3_BUCKET }}" >> "$GITHUB_ENV"
              echo "S3_ROLE_ARN=${{ secrets.AWS_RC_EXTRAS_ROLE_ARN }}" >> "$GITHUB_ENV"
              ;;
            stable-staging)
              echo "S3_BUCKET=${{ secrets.AWS_STABLE_STAGING_EXTRAS_S3_BUCKET }}" >> "$GITHUB_ENV"
              echo "S3_ROLE_ARN=${{ secrets.AWS_STABLE_STAGING_EXTRAS_ROLE_ARN }}" >> "$GITHUB_ENV"
              ;;
            legacy-nightly)
              echo "S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" >> "$GITHUB_ENV"
              echo "S3_ROLE_ARN=${{ secrets.AWS_ROLE_ARN }}" >> "$GITHUB_ENV"
              S3_BASE="${{ inputs.s3_root_directory }}"
              if [[ -z "${S3_BASE}" ]]; then
                S3_BASE="nightly"
              fi
              echo "S3_ROOT_DIRECTORY=${S3_BASE}/$(date +%Y_%m_%d)/manylinux" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown s3_bucket_env: ${{ inputs.s3_bucket_env }}"
              exit 1
              ;;
          esac

      - name: Configure AWS credentials
        if: inputs.upload_to_s3 == true || inputs.upload_to_s3 == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.S3_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload DEB to S3
        if: inputs.upload_to_s3 == true || inputs.upload_to_s3 == 'true'
        run: |
          DEB_SRC=$(ls ${{ env.DIST_DIR }}/*.deb | head -1)
          DEB_BASE=$(basename "${DEB_SRC}")
          if [[ -n "${BUILD_TIMESTAMP}" ]]; then
            DEB_NAME="amdrocm${ROCM_VERSION}-$(echo "${DEB_BASE}" | sed 's/_\([^_]*\.deb\)$/+'"${BUILD_TIMESTAMP}"'_\1/')"
          else
            DEB_NAME="amdrocm${ROCM_VERSION}-${DEB_BASE}"
          fi
          S3_DEB_BASE="s3://${S3_BUCKET}/${{ env.S3_ROOT_DIRECTORY }}/packages/deb"
          aws s3 cp \
            "${DEB_SRC}" \
            "${S3_DEB_BASE}/pool/main/${DEB_NAME}" \
            --no-progress

      - name: Generate and Upload DEB Metadata to S3
        if: inputs.upload_to_s3 == true || inputs.upload_to_s3 == 'true'
        run: |
          DEB_SRC=$(ls ${{ env.DIST_DIR }}/*.deb | head -1)
          DEB_BASE=$(basename "${DEB_SRC}")
          if [[ -n "${BUILD_TIMESTAMP}" ]]; then
            DEB_NAME="amdrocm${ROCM_VERSION}-$(echo "${DEB_BASE}" | sed 's/_\([^_]*\.deb\)$/+'"${BUILD_TIMESTAMP}"'_\1/')"
          else
            DEB_NAME="amdrocm${ROCM_VERSION}-${DEB_BASE}"
          fi
          SUITE="stable"
          mkdir -p deb-repo/pool/main deb-repo/dists/${SUITE}/main/binary-amd64
          cp "${DEB_SRC}" \
            deb-repo/pool/main/${DEB_NAME}

          # Generate Packages index
          cd deb-repo
          dpkg-scanpackages pool/main /dev/null > dists/${SUITE}/main/binary-amd64/Packages
          gzip -k -f dists/${SUITE}/main/binary-amd64/Packages

          # Build Release file manually (apt-ftparchive unavailable on RHEL)
          PKGS="dists/${SUITE}/main/binary-amd64/Packages"
          PKGS_GZ="${PKGS}.gz"
          cat > dists/${SUITE}/Release <<EOF
          Origin: ROCm Optiq
          Label: ${SUITE}
          Suite: ${SUITE}
          Codename: ${SUITE}
          Architectures: amd64
          Components: main
          Date: $(date -u '+%a, %d %b %Y %H:%M:%S UTC')
          MD5Sum:
           $(md5sum ${PKGS}    | awk '{print $1, "'$(wc -c < ${PKGS})'",    "main/binary-amd64/Packages"}')
           $(md5sum ${PKGS_GZ} | awk '{print $1, "'$(wc -c < ${PKGS_GZ})'", "main/binary-amd64/Packages.gz"}')
          SHA256:
           $(sha256sum ${PKGS}    | awk '{print $1, "'$(wc -c < ${PKGS})'",    "main/binary-amd64/Packages"}')
           $(sha256sum ${PKGS_GZ} | awk '{print $1, "'$(wc -c < ${PKGS_GZ})'", "main/binary-amd64/Packages.gz"}')
          EOF

          cd ..
          S3_DEB_BASE="s3://${S3_BUCKET}/${{ env.S3_ROOT_DIRECTORY }}/packages/deb"
          aws s3 cp --recursive deb-repo/dists \
            "${S3_DEB_BASE}/dists/" \
            --no-progress

      - name: Generate RPM Metadata and Upload RPM to S3
        if: inputs.upload_to_s3 == true || inputs.upload_to_s3 == 'true'
        run: |
          RPM_SRC=$(ls ${{ env.DIST_DIR }}/*.rpm | head -1)
          if [[ -n "${BUILD_TIMESTAMP}" ]]; then
            RPM_NAME="amdrocm${ROCM_VERSION}-$(basename "${RPM_SRC}" | sed 's/\.el[0-9]\+//' | sed 's/\.\([^.]*\.rpm\)$/\.'"${BUILD_TIMESTAMP}"'\.\1/')"
          else
            RPM_NAME="amdrocm${ROCM_VERSION}-$(basename "${RPM_SRC}" | sed 's/\.el[0-9]\+//')"
          fi
          S3_RPM_PREFIX="s3://${S3_BUCKET}/${{ env.S3_ROOT_DIRECTORY }}/packages/rpm/x86_64"

          # Use the renamed file so repodata <location href> matches the S3 key
          mkdir -p rpm-repo
          cp "${RPM_SRC}" "rpm-repo/${RPM_NAME}"
          createrepo_c rpm-repo/

          aws s3 cp \
            "rpm-repo/${RPM_NAME}" \
            "${S3_RPM_PREFIX}/${RPM_NAME}" \
            --no-progress
          aws s3 cp --recursive rpm-repo/repodata \
            "${S3_RPM_PREFIX}/repodata/" \
            --no-progress

      - name: Upload Tarball to S3
        if: inputs.upload_to_s3 == true || inputs.upload_to_s3 == 'true'
        run: |
          TGZ_SRC=$(ls ${{ env.DIST_DIR }}/*.tar.gz | head -1)
          TGZ_BASE=$(basename "${TGZ_SRC}")
          if [[ -n "${BUILD_TIMESTAMP}" ]]; then
            TGZ_NAME="amdrocm${ROCM_VERSION}-$(echo "${TGZ_BASE}" | sed 's/\.tar\.gz$/\.'"${BUILD_TIMESTAMP}"'\.tar\.gz/')"
          else
            TGZ_NAME="amdrocm${ROCM_VERSION}-${TGZ_BASE}"
          fi
          S3_TGZ_PREFIX="s3://${S3_BUCKET}/${{ env.S3_ROOT_DIRECTORY }}/tarball"
          aws s3 cp \
            "${TGZ_SRC}" \
            "${S3_TGZ_PREFIX}/${TGZ_NAME}" \
            --no-progress

      - name: Announce Test Failure
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "Tests have failed! Please see uploaded CTest logs for more information"
          exit 1
