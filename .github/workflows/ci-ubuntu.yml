name: Ubuntu Continuous Integration
run-name: roc-optiq-ubuntu-ci

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: 'JSON array of OS versions to test'
        type: string
        default: '[ "22.04", "24.04", "26.04" ]'
      cmake_config_preset:
        description: 'CMake Config Preset to Use'
        type: string
        default: 'linux-release'
      cmake_build_preset:
        description: 'CMake Build Preset to Use'
        type: string
        default: 'Linux Release Build'
      enable_internal_banner:
        description: 'Enable the internal banner?'
        type: boolean
        default: false
      upload_to_github:
        description: 'Upload build artifacts to GitHub Artifacts?'
        type: boolean
        default: false
      upload_to_s3:
        description: 'Upload built artifacts to the roc-optiq S3 bucket?'
        type: boolean
        default: false
      s3_root_directory:
        description: 'The root directory to use when uploading to the roc-optiq S3 bucket'
        type: choice
        default: 'test'
        options: 
          - test
          - nightly
          - rc
          - release
          - nightly-experimental
      release_version:
        description: 'Manually specify a release version to use in the S3 bucket path. Defaults to YYYY_MM_DD timestamp if left empty.'
        type: string
        default: ''
      crypto_backend:
        description: 'Crypto backend for libssh2 (mbedTLS or OpenSSL)'
        type: string
        default: 'mbedTLS'
      cmake_args:
        description: 'Extra CMake flags, space separated (e.g. -DROCPROFVIS_ENABLE_EXPERIMENTAL=ON)'
        type: string
        default: ''
      enable_ui_tests:
        description: 'Build + run the Dear ImGui UI tests?'
        type: boolean
        default: false
      artifact_suffix:
        description: 'Suffix to append to artifact names (e.g. -experimental)'
        type: string
        default: ''
  workflow_call:
    inputs:
      os_version:
        description: 'JSON array of OS versions to test'
        type: string
        default: '[ "22.04", "24.04", "26.04" ]'
      crypto_backend:
        description: 'Crypto backend for libssh2 (mbedTLS or OpenSSL)'
        type: string
        default: 'mbedTLS'
      cmake_args:
        description: 'Extra CMake flags, space separated (e.g. -DROCPROFVIS_ENABLE_EXPERIMENTAL=ON)'
        type: string
        default: ''
      enable_ui_tests:
        description: 'Build + run the Dear ImGui UI tests?'
        type: boolean
        default: false
      cmake_config_preset:
        description: 'CMake Config Preset to Use'
        type: string
        default: 'linux-release'
      cmake_build_preset:
        description: 'CMake Build Preset to Use'
        type: string
        default: 'Linux Release Build'
      enable_internal_banner:
        description: 'Enable the internal banner?'
        type: boolean
        default: false
      upload_to_github:
        description: 'Upload build artifacts to GitHub Artifacts?'
        type: boolean
        default: false
      upload_to_s3:
        description: 'Upload built artifacts to the roc-optiq S3 bucket?'
        type: boolean
        default: false
      s3_root_directory:
        description: 'The root directory to use when uploading to the roc-optiq S3 bucket'
        type: string
        default: 'test'
      release_version:
        description: 'Manually specify a release version to use in the S3 bucket path. Defaults to YYYY_MM_DD timestamp if left empty.'
        type: string
        default: ''
      artifact_suffix:
        description: 'Suffix to append to artifact names (e.g. -experimental)'
        type: string
        default: ''

env:
  BUILD_DIR: "build"
  DIST_DIR: "dist"
  BUILD_FILE_NAME: "roc-optiq"
  ENABLE_INTERNAL_BANNER: ${{ (inputs.enable_internal_banner == true || inputs.enable_internal_banner == 'true') && 'ON' || 'OFF' }}
  CMAKE_ARGS: ${{ inputs.cmake_args }}
  ENABLE_UI_TESTS: ${{ (inputs.enable_ui_tests == true || inputs.enable_ui_tests == 'true') && 'ON' || 'OFF' }}
  CTEST_PREFIX: ${{ (inputs.enable_ui_tests == true || inputs.enable_ui_tests == 'true') && 'xvfb-run -a' || '' }}
  BUILD_TARGETS: ${{ (inputs.enable_ui_tests == true || inputs.enable_ui_tests == 'true') && 'all package' || 'package' }}
  S3_ROOT_DIRECTORY: ${{ inputs.s3_root_directory }}
  RELEASE_VERSION: ${{ inputs.release_version }}

jobs:
  ubuntu:
    name: Ubuntu ${{ matrix.os-version }} • Optiq CI • GitHub Artifacts (${{ inputs.upload_to_github }}) • S3 Artifacts (${{ inputs.upload_to_s3 }})
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      id-token: write
      contents: read
    container:
      image: ghcr.io/rocm/optiq-ci-ubuntu:${{ matrix.os-version }}
    strategy:
      fail-fast: false
      matrix: 
        os-version: ${{ fromJson(inputs.os_version) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          submodules: true
          persist-credentials: false

      - name: Install OpenSSL
        if: inputs.crypto_backend == 'OpenSSL'
        run: |
          apt-get update
          apt-get install -y libssl-dev

      - name: Install Python development files
        if: contains(inputs.cmake_args, 'ENABLE_VENDOR_PYTHON=OFF')
        run: |
          apt-get update
          apt-get install -y python3-dev
          python3 --version

      - name: Build, Make, and Verify Installation
        env:
          INPUTS_CMAKE_CONFIG_PRESET: ${{ inputs.cmake_config_preset }}
          INPUTS_CRYPTO_BACKEND: ${{ inputs.crypto_backend }}
        run: |
          source /opt/vulkan/**/setup-env.sh
          cmake -B ${{ env.BUILD_DIR }} \
            --preset ${INPUTS_CMAKE_CONFIG_PRESET} \
            -DROCPROFVIS_ENABLE_INTERNAL_BANNER=${{ env.ENABLE_INTERNAL_BANNER }} \
            ${CMAKE_ARGS} \
            -DROCPROFVIS_ENABLE_UI_TESTS=${{ env.ENABLE_UI_TESTS }} \
            -DCRYPTO_BACKEND=${INPUTS_CRYPTO_BACKEND}
          cmake --build ${{ env.BUILD_DIR }} --parallel 4 --target ${{ env.BUILD_TARGETS }}
          if [ -e ${{ env.BUILD_DIR }}/${{ env.BUILD_FILE_NAME }} ]; then
            echo "✅ ${{ env.BUILD_FILE_NAME }} has been successfully built!"
          else
            echo "❌ ${{ env.BUILD_FILE_NAME }} was not built!"
            exit 1
          fi

      - name: Run Tests
        id: run_tests
        continue-on-error: true
        timeout-minutes: 10
        run: |
          cd ${{ env.BUILD_DIR }}
          ${{ env.CTEST_PREFIX }} ctest \
            --output-on-failure \
            --no-tests=error \
            --output-junit ctest-results.xml

      - name: Backtrace Compute UI Test (on failure)
        if: steps.run_tests.outcome == 'failure' && env.ENABLE_UI_TESTS == 'ON'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          # ctest reports an abort without a call stack. Re-run the compute UI
          # test under gdb so the log shows where the process died.
          apt-get update
          apt-get install -y gdb
          # Same working directory as the ctest registration.
          xvfb-run -a gdb -batch \
            -ex "set pagination off" \
            -ex "handle SIGPIPE nostop noprint" \
            -ex run \
            -ex "thread apply all bt" \
            --args "${GITHUB_WORKSPACE}/${{ env.BUILD_DIR }}/roc-optiq-tests" \
              --run-tests -f "${GITHUB_WORKSPACE}/sample/rocprof_compute_23ed6f36.db" \
            || true

      - name: Upload Test Logs (on failure)
        if: steps.run_tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-ubuntu-${{ matrix.os-version }}${{ inputs.artifact_suffix }}
          path: |
            ${{ env.BUILD_DIR }}/ctest-results.xml
            ${{ env.BUILD_DIR }}/Testing/Temporary/**
          retention-days: 7

      - name: Prepare Distribution Artifacts
        run: |
          mkdir ${{ env.DIST_DIR }}
          cp ${{ env.BUILD_DIR }}/*.tar.gz ${{ env.DIST_DIR }}/
          cp ${{ env.BUILD_DIR }}/*.deb ${{ env.DIST_DIR }}/
          ls -l ${{ env.DIST_DIR }}/
      
      - name: Upload GitHub Artifacts
        if: inputs.upload_to_github == true || inputs.upload_to_github == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roc-optiq-ubuntu-${{ matrix.os-version }}-release${{ inputs.artifact_suffix }}
          path: |
            ${{ env.DIST_DIR }}/
          retention-days: 2

      - name: Configure AWS credentials
        if: inputs.upload_to_s3 == true || inputs.upload_to_s3 == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Generate Metadata for S3
        if: inputs.upload_to_s3 == true || inputs.upload_to_s3 == 'true'
        working-directory: ${{ env.DIST_DIR }}
        run: |
          dpkg-scanpackages . /dev/null > Packages
          gzip -k -f Packages
          APT_SUITE="optiq-nightly"
          apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="ROCm Optiq" \
              -o APT::FTPArchive::Release::Label="${APT_SUITE}" \
              -o APT::FTPArchive::Release::Suite="${APT_SUITE}" \
              -o APT::FTPArchive::Release::Codename="${APT_SUITE}" \
              release . > Release

      - name: Upload Build to S3
        if: inputs.upload_to_s3 == true || inputs.upload_to_s3 == 'true'
        env:
          MATRIX_OS_VERSION: ${{ matrix.os-version }}
        run: |
          if [ -z "${{ env.RELEASE_VERSION }}" ]; then
            echo "No release version provided, defaulting to using TIMESTAMP as S3_SECONDARY_DIRECTORY"
            S3_SECONDARY_DIRECTORY=$(date +%Y_%m_%d)
          else
            echo "Release Version ${{ env.RELEASE_VERSION }} provided, using ${{ env.RELEASE_VERSION }} as S3_SECONDARY_DIRECTORY"
            S3_SECONDARY_DIRECTORY="${{ env.RELEASE_VERSION }}"
          fi
          aws s3 cp --recursive ${{ env.DIST_DIR }} s3://${{ secrets.AWS_S3_BUCKET }}/${{ env.S3_ROOT_DIRECTORY }}/$S3_SECONDARY_DIRECTORY/ubuntu/${MATRIX_OS_VERSION}/ \
            --no-progress

      - name: Announce Test Failure
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "Tests have failed! Please see uploaded CTest logs for more information"
          exit 1
